<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Dashboard — FinalYR Pipeline</title>
  <link rel="stylesheet" href="/dashboard/static/styles.css">
</head>
<body>
  <div id="app" class="app-root">
    <main class="login-screen" id="login-screen">
      <div class="login-card">
        <h1>Pipeline Dashboard</h1>
        <p class="muted">Login with demo credentials (admin/admin123 or user/user123)</p>
        <form id="login-form">
          <input id="username" placeholder="Username" required>
          <input id="password" type="password" placeholder="Password" required>
          <button type="submit" class="btn-primary">Sign in</button>
        </form>
      </div>
    </main>

    <header class="dash-header hidden" id="dash-header">
      <div class="brand">FinalYR Pipeline</div>
      <div class="header-actions">
        <button id="logout-btn" class="btn-ghost">Logout</button>
      </div>
    </header>

    <section class="dashboard hidden" id="dashboard">
      <section class="overview" id="overview-cards"></section>

      <section class="alerts-section">
        <div class="alerts-header">
          <h2>Live Alerts</h2>
          <div class="filters">
            <select id="alert-filter">
              <option value="all">All</option>
              <option value="critical">Critical</option>
              <option value="verified">Verified</option>
            </select>
            <button id="export-csv" class="btn-secondary">Export CSV</button>
          </div>
        </div>
        <table class="alerts-table" id="alerts-table">
          <thead>
            <tr><th>ID</th><th>Type</th><th>Confidence</th><th>Signature</th><th>Time</th><th>Actions</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <section class="analytics" id="analytics">
        <h2>Analytics</h2>
        <div class="analytics-cards" id="analytics-cards"></div>
      </section>
    </section>

    <div id="alert-modal" class="modal hidden">
      <div class="modal-inner">
        <button class="modal-close" id="modal-close">×</button>
        <div id="modal-body"></div>
      </div>
    </div>
  </div>
  <script src="/dashboard/static/app.js"></script>
</body>
</html>
